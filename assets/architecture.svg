<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="m-slate" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="m-rose" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#fb7185"/>
    </marker>
    <marker id="m-emerald" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="920" height="900" fill="#020617"/>
  <rect width="920" height="900" fill="url(#grid)"/>

  <!-- Title -->
  <text x="460" y="34" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">PROJECT FOUNDRY</text>
  <text x="460" y="54" text-anchor="middle" fill="#64748b" font-size="11">Private local AI agent fleet · no cloud models</text>

  <!-- On-premises boundary -->
  <rect x="40" y="262" width="840" height="445" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="56" y="286" fill="#fbbf24" font-size="11">on-premises · Mac Studio fleet · 3x M3 Ultra + LiteLLM router</text>

  <!-- Team (outside boundary) -->
  <rect x="360" y="84" width="200" height="64" rx="6" fill="#0f172a"/>
  <rect x="360" y="84" width="200" height="64" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="460" y="110" text-anchor="middle" fill="#e2e8f0" font-size="12">Team</text>
  <text x="460" y="130" text-anchor="middle" fill="#67e8f9" font-size="9">20-30 people</text>

  <!-- Bridge (outside boundary) -->
  <rect x="320" y="180" width="280" height="56" rx="6" fill="#0f172a"/>
  <rect x="320" y="180" width="280" height="56" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="460" y="204" text-anchor="middle" fill="#e2e8f0" font-size="12">Bridge</text>
  <text x="460" y="222" text-anchor="middle" fill="#fdba74" font-size="9">Telegram · Slack · Matrix</text>

  <!-- Agents label -->
  <text x="110" y="307" fill="#94a3b8" font-size="10">Hermes agent fleet · one profile per function</text>

  <!-- Agent boxes (emerald) -->
  <g>
    <rect x="110" y="322" width="138" height="64" rx="6" fill="#0f172a"/>
    <rect x="110" y="322" width="138" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="179" y="350" text-anchor="middle" fill="#e2e8f0" font-size="12">Atlas</text>
    <text x="179" y="368" text-anchor="middle" fill="#6ee7b7" font-size="9">general ops</text>
  </g>
  <g>
    <rect x="258" y="322" width="138" height="64" rx="6" fill="#0f172a"/>
    <rect x="258" y="322" width="138" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="327" y="350" text-anchor="middle" fill="#e2e8f0" font-size="12">Scribe</text>
    <text x="327" y="368" text-anchor="middle" fill="#6ee7b7" font-size="9">drafting</text>
  </g>
  <g>
    <rect x="406" y="322" width="138" height="64" rx="6" fill="#0f172a"/>
    <rect x="406" y="322" width="138" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="475" y="350" text-anchor="middle" fill="#e2e8f0" font-size="12">Forge</text>
    <text x="475" y="368" text-anchor="middle" fill="#6ee7b7" font-size="9">code</text>
  </g>
  <g>
    <rect x="554" y="322" width="138" height="64" rx="6" fill="#0f172a"/>
    <rect x="554" y="322" width="138" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="623" y="350" text-anchor="middle" fill="#e2e8f0" font-size="12">Reason</text>
    <text x="623" y="368" text-anchor="middle" fill="#6ee7b7" font-size="9">reasoning</text>
  </g>
  <g>
    <rect x="702" y="322" width="138" height="64" rx="6" fill="#0f172a"/>
    <rect x="702" y="322" width="138" height="64" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="771" y="350" text-anchor="middle" fill="#e2e8f0" font-size="12">Watch</text>
    <text x="771" y="368" text-anchor="middle" fill="#6ee7b7" font-size="9">cron</text>
  </g>

  <!-- Inference label -->
  <text x="110" y="428" fill="#94a3b8" font-size="10">llama-server · OpenAI-compatible API · 127.0.0.1</text>

  <!-- Inference boxes (violet), 2 + center channel + 2 -->
  <g>
    <rect x="110" y="442" width="150" height="64" rx="6" fill="#0f172a"/>
    <rect x="110" y="442" width="150" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="185" y="470" text-anchor="middle" fill="#e2e8f0" font-size="11">Qwen2.5-72B</text>
    <text x="185" y="488" text-anchor="middle" fill="#c4b5fd" font-size="9">general · :8080</text>
  </g>
  <g>
    <rect x="270" y="442" width="150" height="64" rx="6" fill="#0f172a"/>
    <rect x="270" y="442" width="150" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="345" y="470" text-anchor="middle" fill="#e2e8f0" font-size="11">Coder-32B</text>
    <text x="345" y="488" text-anchor="middle" fill="#c4b5fd" font-size="9">code · :8081</text>
  </g>
  <g>
    <rect x="500" y="442" width="150" height="64" rx="6" fill="#0f172a"/>
    <rect x="500" y="442" width="150" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="575" y="470" text-anchor="middle" fill="#e2e8f0" font-size="11">R1-Distill</text>
    <text x="575" y="488" text-anchor="middle" fill="#c4b5fd" font-size="9">reason · :8082</text>
  </g>
  <g>
    <rect x="660" y="442" width="150" height="64" rx="6" fill="#0f172a"/>
    <rect x="660" y="442" width="150" height="64" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="735" y="470" text-anchor="middle" fill="#e2e8f0" font-size="11">bge-m3</text>
    <text x="735" y="488" text-anchor="middle" fill="#c4b5fd" font-size="9">embeddings · :8083</text>
  </g>

  <!-- Vault -->
  <rect x="110" y="568" width="700" height="56" rx="6" fill="#0f172a"/>
  <rect x="110" y="568" width="700" height="56" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="460" y="592" text-anchor="middle" fill="#e2e8f0" font-size="12">Obsidian vault · second brain</text>
  <text x="460" y="610" text-anchor="middle" fill="#c4b5fd" font-size="9">Syncthing / NAS</text>

  <!-- Arrows -->
  <!-- Team -> Bridge -->
  <line x1="460" y1="148" x2="460" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#m-slate)"/>
  <!-- Bridge -> Agents (crosses boundary; residual risk) -->
  <line x1="460" y1="236" x2="460" y2="322" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#m-rose)"/>
  <text x="470" y="285" fill="#fb7185" font-size="9">residual risk: transits messenger servers</text>
  <!-- Agents <-> Inference -->
  <line x1="240" y1="386" x2="240" y2="442" stroke="#34d399" stroke-width="1.5" marker-start="url(#m-emerald)" marker-end="url(#m-emerald)"/>
  <text x="248" y="416" fill="#34d399" font-size="9">prompt · response</text>
  <!-- Agents <-> Vault (through center channel) -->
  <line x1="460" y1="386" x2="460" y2="568" stroke="#34d399" stroke-width="1.5" marker-start="url(#m-emerald)" marker-end="url(#m-emerald)"/>
  <text x="460" y="536" text-anchor="middle" fill="#34d399" font-size="9">read / write vault</text>

  <!-- Cloud fallback trust boundary -->
  <rect x="280" y="732" width="360" height="96" rx="10" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="296" y="752" fill="#fb7185" font-size="9">policy-gated · optional</text>
  <rect x="300" y="764" width="320" height="52" rx="6" fill="#0f172a"/>
  <rect x="300" y="764" width="320" height="52" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="786" text-anchor="middle" fill="#e2e8f0" font-size="11">Cloud fallback</text>
  <text x="460" y="804" text-anchor="middle" fill="#94a3b8" font-size="9">DeepSeek API · DashScope (non-sensitive only)</text>
  <!-- Inference -> Cloud fallback -->
  <line x1="735" y1="506" x2="735" y2="764" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#m-rose)"/>

  <!-- Legend -->
  <g font-size="9" fill="#cbd5e1">
    <rect x="60" y="848" width="10" height="10" rx="2" fill="rgba(6,78,59,0.6)" stroke="#34d399"/>
    <text x="78" y="857">Hermes agents</text>
    <rect x="230" y="848" width="10" height="10" rx="2" fill="rgba(76,29,149,0.6)" stroke="#a78bfa"/>
    <text x="248" y="857">inference / vault</text>
    <rect x="400" y="848" width="10" height="10" rx="2" fill="rgba(8,51,68,0.6)" stroke="#22d3ee"/>
    <text x="418" y="857">team</text>
    <rect x="510" y="848" width="10" height="10" rx="2" fill="rgba(251,146,60,0.5)" stroke="#fb923c"/>
    <text x="528" y="857">bridge (cloud)</text>
    <rect x="680" y="848" width="10" height="10" rx="2" fill="rgba(136,19,55,0.5)" stroke="#fb7185"/>
    <text x="698" y="857">risk / fallback</text>
  </g>
</svg>
